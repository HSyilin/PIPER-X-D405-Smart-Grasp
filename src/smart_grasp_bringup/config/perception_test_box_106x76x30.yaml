smart_grasp_detector:
  ros__parameters:
    # Temporary measured blue test box: 106.5 x 76.5 x 30.0 mm.
    camera_only: false
    detector_backend: hsv
    target_class: blue_block
    hsv_lower: [95, 110, 70]
    hsv_upper: [130, 255, 255]
    min_contour_area: 800.0
    min_solidity: 0.85
    min_rectangularity: 0.65
    yolo_model: ""
    yolo_class: blue_block
    yolo_confidence: 0.70
    min_depth: 0.08
    max_depth: 0.60
    depth_scale: 0.001
    mask_erode_pixels: 3
    min_depth_points: 500
    min_depth_valid_ratio: 0.60
    # The box corner is about 66 mm from its center; 30 mm clips its perimeter.
    point_outlier_radius: 0.080
    # Estimate yaw from the top 8 mm surface band, excluding blue side faces.
    orientation_surface_band: 0.008
    # VMware scheduling can deliver image callbacks before the exact-time TF arrives.
    tf_lookup_timeout: 0.25
    # Used only by collision/grasp geometry; perception never measures or matches size.
    fixed_object_size: [0.1065, 0.0765, 0.0300]
    table_height: -999.0
    table_ransac_threshold: 0.004
    stability_frames: 15
    position_outlier_radius: 0.020
    yaw_outlier_radius_deg: 12.0
    max_position_span: 0.015
    max_yaw_span_deg: 5.0
    ambiguity_score_gap: 0.10
    grasp_depth: 0.020
    tcp_to_grasp_xyz: [0.0, 0.0, 0.1425]
    base_frame: base_link
    camera_frame: camera_color_optical_frame
    color_topic: /camera/camera/color/image_raw
    depth_topic: /camera/camera/aligned_depth_to_color/image_raw
    info_topic: /camera/camera/color/camera_info
