smart_grasp_pick_server:
  ros__parameters:
    planning_group: arm
    base_frame: base_link
    end_effector_link: tcp_link
    planner_id: RRTConnectkConfigDefault
    planning_time: 5.0
    planning_attempts: 5
    velocity_scaling: 0.05
    acceleration_scaling: 0.05
    execution_allowed: false
    calibration_validated: false
    target_max_age: 0.5
    detection_wait_timeout: 1.0
    stable_detection_wait_timeout: 3.0
    ambiguity_score_gap: 0.10
    pregrasp_distance: 0.120
    grasp_depth: 0.020
    lift_height: 0.050
    tcp_to_grasp_xyz: [0.0, 0.0, 0.1425]
    cartesian_step: 0.005
    # Do not execute a trajectory that stops short of the grasp or lift pose.
    cartesian_min_fraction: 1.0
    validate_all_candidate_approaches: true
    pregrasp_reobserve_mode: validate_only
    reobserve_max_xy_shift: 0.005
    reobserve_max_z_shift: 0.005
    reobserve_max_axis_yaw_deg: 5.0
    start_joint_tolerance: 0.05
    # Wait for physical feedback after each FakeSystem trajectory completes.
    execution_joint_tolerance: 0.03
    execution_settle_timeout: 20.0
    wrist_jump_threshold: 0.5
    # Recorded from five identical real-arm samples on 2026-08-01. The pick
    # state machine must reach this eye-in-hand observation pose before detect.
    observation_joint_positions: [0.0, 0.195633956, -0.481920313, 0.945113243, 0.0, 0.0]
    observation_joint_tolerance: 0.02
    # Fixed temporary values for grasping the measured 76.5 mm short edge.
    gripper_open: 0.090
    gripper_close: 0.060
    gripper_force: 0.5
    contact_width_min: 0.0685
    contact_width_max: 0.0845
    gripper_timeout: 3.0
    gripper_action: /gripper_controller/follow_joint_trajectory
    joint_state_topic: /feedback/joint_states
    # 2026-08-01 table setup: the arm base and target share the same mounting
    # plane (base_link z=0). Sink the collision top by 3 mm to avoid a numerical
    # contact with the robot base mesh while keeping the support surface guarded.
    table_height: -0.003
    # This slab covers the target and direct grasp corridor only. Its dimensions
    # are collision-model bounds, not a claim about the physical table edges.
    table_size: [0.46, 0.50, 0.05]
    table_center_xy: [0.35, 0.04]
    # The operator confirmed the direct arm-to-target path is clear for this test.
    static_obstacles: ""
    workspace: [-0.20, -0.70, -0.20, 0.90, 0.70, 1.20]
